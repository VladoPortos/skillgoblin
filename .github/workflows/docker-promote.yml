name: Promote verified digest to latest

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Exact tested manifest digest (sha256:...) from the publish summary'
        required: true
        type: string
      commit:
        description: 'Full 40-character commit SHA from the successful publish run'
        required: true
        type: string
      verified:
        description: 'I tested this exact digest and approve promoting it to latest'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-latest
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify source and successful CI, then promote exact digest
        env:
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ inputs.commit }}
          VERIFIED: ${{ inputs.verified }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED" == true ]]
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker-publish.yml/runs?head_sha=$COMMIT&status=success" \
            --jq '.workflow_runs | any(.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))' | grep -qx true
          image=vladoportos/skillgoblin
          registered=$(docker buildx imagetools inspect "$image:sha-$COMMIT" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$registered" == "$DIGEST" ]]
          # Registry lookup by digest must succeed independently of the tag.
          docker buildx imagetools inspect "$image@$DIGEST"
          docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"
          promoted=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$promoted" == "$DIGEST" ]]
          echo "Promoted \`$image@$DIGEST\` from commit \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
