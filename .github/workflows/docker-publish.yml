name: Test and publish images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production and run locked unit and browser suites
        run: docker compose -f docker-compose.test.yml run --build --rm tests
      - name: Service logs
        if: always()
        run: docker compose -f docker-compose.test.yml logs web
      - name: Remove isolated test data
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse to overwrite a commit architecture tag
        env:
          COMMIT: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/tag.json --write-out "%{http_code}" "https://hub.docker.com/v2/repositories/vladoportos/skillgoblin/tags/sha-$COMMIT-$ARCH/")
          [[ "$status" == 404 ]] || { echo "Commit tag already exists or registry lookup failed (HTTP $status)"; exit 1; }
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prod
          target: production
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: vladoportos/skillgoblin:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish commit manifest and beta alias
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=vladoportos/skillgoblin
          status=$(curl --silent --show-error --output /tmp/tag.json --write-out "%{http_code}" "https://hub.docker.com/v2/repositories/$image/tags/sha-$COMMIT/")
          [[ "$status" == 404 ]] || { echo "Commit tag already exists or registry lookup failed (HTTP $status)"; exit 1; }
          docker buildx imagetools create --tag "$image:sha-$COMMIT" "$image:sha-$COMMIT-amd64" "$image:sha-$COMMIT-arm64"
          digest=$(docker buildx imagetools inspect "$image:sha-$COMMIT" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools create --tag "$image:beta" "$image@$digest"
          echo "Test this exact image before promotion: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
