---
services:
  skillgoblin:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - ./data/database:/app/data/database
      - ./data/content:/app/data/content
    command: sh -c "apk add --no-cache python3 make g++ ffmpeg && cd frontend && npm ci && npm run dev"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CHOKIDAR_POLLING_INTERVAL=60000 # Default polling interval in ms (60 seconds)
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
